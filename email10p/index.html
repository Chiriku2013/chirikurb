<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultra Premium Temp Mail</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #030014;
      --glass: rgba(13, 14, 21, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #818cf8;
      --primary-glow: rgba(129, 140, 248, 0.5);
      --secondary: #c084fc;
      --accent: #10b981;
      --danger: #f43f5e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2vh 2vw;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Background Orbs */
    .bg-orbs {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(90px); animation: float 20s infinite alternate ease-in-out;
    }
    .orb-1 { width: 50vw; height: 50vw; background: rgba(79, 70, 229, 0.25); top: -20%; left: -10%; animation-duration: 25s; }
    .orb-2 { width: 40vw; height: 40vw; background: rgba(168, 85, 247, 0.2); bottom: -10%; right: -10%; animation-duration: 20s; animation-delay: -5s; }
    .orb-3 { width: 30vw; height: 30vw; background: rgba(16, 185, 129, 0.15); top: 40%; left: 40%; animation-duration: 30s; animation-delay: -10s; }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 10%) scale(1.1); }
      100% { transform: translate(-5%, -5%) scale(0.95); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; transition: 0.3s; }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    .container { width: 100%; max-width: 1400px; display: flex; flex-direction: column; gap: 24px; z-index: 1; }

    /* Header */
    .header { text-align: center; animation: slideDown 1s cubic-bezier(0.16, 1, 0.3, 1); margin-bottom: 10px; }
    .header h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(32px, 5vw, 48px); font-weight: 800; letter-spacing: -1px;
      background: linear-gradient(to right, #fff, #c084fc, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(192, 132, 252, 0.3));
    }
    .header p { color: var(--muted); font-size: 1.1rem; margin-top: 8px; font-weight: 500; }

    /* Layout Grid */
    .layout-grid {
      display: grid; grid-template-columns: 380px 1fr; gap: 24px;
      animation: fadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0;
    }
    @media (max-width: 992px) { .layout-grid { grid-template-columns: 1fr; } }

    /* Glass Panels */
    .glass-panel {
      background: var(--glass);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight);
      border-radius: 24px; padding: 24px;
      box-shadow: 0 30px 60px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-panel:hover { box-shadow: 0 30px 60px -12px rgba(0,0,0,0.6), 0 0 30px rgba(129, 140, 248, 0.1); border-color: rgba(255,255,255,0.15); }

    /* Timer */
    .timer-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(16, 185, 129, 0.1); color: var(--accent);
      border: 1px solid rgba(16, 185, 129, 0.3); padding: 8px 16px;
      border-radius: 100px; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 16px;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); transition: 0.3s;
    }
    .timer-badge.urgent {
      background: rgba(244, 63, 94, 0.1); color: var(--danger); border-color: rgba(244, 63, 94, 0.3);
      box-shadow: 0 0 20px rgba(244, 63, 94, 0.3); animation: pulse 1s infinite;
    }

    /* Inputs */
    .input-group { margin-bottom: 24px; position: relative; }
    .label { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .input-wrapper {
      display: flex; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
      border-radius: 16px; overflow: hidden; transition: all 0.3s; position: relative;
    }
    .input-wrapper::after {
      content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease;
    }
    .input-wrapper:hover::after { width: 100%; }
    .input-wrapper input {
      flex: 1; background: transparent; border: none; color: #fff; padding: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 600; outline: none; letter-spacing: 0.5px;
    }
    .btn-icon {
      background: transparent; border: none; color: var(--muted); padding: 0 18px;
      cursor: pointer; transition: 0.2s; font-size: 16px;
    }
    .btn-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }

    /* Buttons */
    .actions-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
    .btn {
      padding: 14px 20px; border-radius: 14px; border: none; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); font-family: 'Outfit', sans-serif; font-size: 15px;
      position: relative; overflow: hidden; z-index: 1;
    }
    .btn::before {
      content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: 0.5s; z-index: -1;
    }
    .btn:hover::before { left: 100%; }
    
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; box-shadow: 0 10px 25px var(--primary-glow); }
    .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 35px var(--primary-glow); }
    .btn-outline { background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border); color: var(--text); }
    .btn-outline:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); border-color: rgba(255,255,255,0.2); }

    /* Inbox List */
    .inbox-header { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--glass-border); }
    .inbox-header h3 { font-family: 'Outfit', sans-serif; font-size: 18px; margin: 0; }
    .badge-count { background: var(--primary); color: white; padding: 2px 8px; border-radius: 100px; font-size: 12px; font-weight: 700; }
    
    .inbox-list { display: flex; flex-direction: column; gap: 12px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }
    
    .mail-item {
      padding: 18px; background: rgba(255,255,255,0.02); border: 1px solid transparent;
      border-radius: 16px; cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative; animation: slideInLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .mail-item.unread::after {
      content: ''; position: absolute; top: 18px; right: 18px; width: 10px; height: 10px;
      background: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent);
    }
    .mail-item:hover { background: rgba(255,255,255,0.05); transform: translateX(6px); border-color: var(--glass-border); }
    .mail-item.active {
      background: linear-gradient(to right, rgba(129, 140, 248, 0.1), transparent);
      border-left: 4px solid var(--primary); border-radius: 4px 16px 16px 4px;
    }

    .mail-sender { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 20px;}
    .mail-subj { font-size: 14px; color: var(--muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mail-time { font-size: 12px; color: #64748b; font-weight: 600; }

    /* Mail Viewer */
    .viewer-container { display: flex; flex-direction: column; height: 100%; min-height: 600px; }
    .viewer-header { padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); margin-bottom: 20px; }
    .viewer-title { font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #fff; line-height: 1.3; }
    .viewer-meta { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 16px; }
    
    .viewer-body { flex: 1; border-radius: 16px; overflow: hidden; position: relative; background: #fff; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); transition: 0.5s; }
    
    .viewer-iframe { width: 100%; height: 100%; border: none; background: #ffffff; opacity: 0; transition: opacity 0.5s ease; }
    .viewer-iframe.loaded { opacity: 1; }

    .empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); background: transparent; z-index: 10; }
    .empty-state .icon-wrapper {
      width: 100px; height: 100px; background: rgba(255,255,255,0.03); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 20px;
      font-size: 40px; color: var(--primary); box-shadow: 0 0 30px rgba(129, 140, 248, 0.1); animation: float 6s infinite ease-in-out;
    }

    /* Toasts */
    #toast-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 9999; }
    .toast {
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
      color: white; padding: 16px 24px; border-radius: 16px; border: 1px solid var(--glass-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 16px; font-weight: 600;
      animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .toast i { font-size: 20px; }
    .toast.success i { color: var(--accent); text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
    .toast.error i { color: var(--danger); text-shadow: 0 0 10px rgba(244, 63, 94, 0.5); }
    .toast.out { animation: fadeOutRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Animations */
    @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideInLeft { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(100%) scale(0.9); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes fadeOutRight { from { opacity: 1; transform: translateX(0) scale(1); } to { opacity: 0; transform: translateX(100%) scale(0.9); } }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    .spin { animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Skeleton Loading */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%); background-size: 400% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  </style>
</head>
<body>

<script>
const API = 'https://api.mail.gw';
const LS_KEY = 'ultra_premium_mail_v3';
const TEN_MIN_MS = 10 * 60 * 1000;
const $ = (id) => document.getElementById(id);

// --- UI / Animations ---
function showToast(msg, type = 'success') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> ${msg}`;
  container.appendChild(toast);
  
  // Audio effect
  try {
    const audio = new Audio(type === 'success' ? 'https://www.soundjay.com/buttons/sounds/button-09.mp3' : 'https://www.soundjay.com/buttons/sounds/button-10.mp3');
    audio.volume = 0.2; audio.play().catch(()=>{});
  } catch(e) {}

  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 400);
  }, 3500);
}

function showSkeleton() {
  const box = $('inbox');
  box.innerHTML = Array(3).fill().map((_, i) => `
    <div class="mail-item" style="animation-delay: ${i*0.1}s; pointer-events: none;">
      <div class="skeleton" style="width: 60%; height: 20px; margin-bottom: 10px;"></div>
      <div class="skeleton" style="width: 90%; height: 16px; margin-bottom: 10px;"></div>
      <div class="skeleton" style="width: 40%; height: 12px;"></div>
    </div>
  `).join('');
}

// --- Utils ---
function now() { return Date.now(); }
function fmtTime(ms) {
  if (ms < 0) ms = 0;
  const m = Math.floor(ms / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return `${m}:${s.toString().padStart(2, '0')}`;
}
function escapeHtml(s) { return String(s || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;'); }

// --- API Logic ---
async function apiReq(path, opts = {}) {
  const res = await fetch(API + path, opts);
  if (!res.ok) throw new Error(`${res.status}`);
  return res.json();
}

let g = { session: null, timerId: null, messages: [] };

async function createAccount() {
  const data = await apiReq('/domains?page=1');
  const arr = data['hydra:member'] || [];
  const domain = arr[Math.floor(Math.random() * arr.length)].domain;
  
  const address = `hi_${Math.random().toString(36).slice(2, 7)}@${domain}`;
  const password = 'VIP' + Math.random().toString(36).slice(2,10) + '!';
  
  await apiReq('/accounts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
  const tok = await apiReq('/token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address, password }) });
  
  const session = { address, password, token: tok.token, id: tok.id, expiresAt: now() + TEN_MIN_MS };
  localStorage.setItem(LS_KEY, JSON.stringify(session));
  return session;
}

async function ensureSession() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e){}
  if (!s || s.expiresAt <= now()) return await createAccount();
  try {
    await apiReq('/me', { headers: { Authorization: 'Bearer ' + s.token } });
    return s;
  } catch { return await createAccount(); }
}

function mountSessionUI() {
  $('email').value = g.session.address;
  $('password').value = g.session.password;
  if (g.timerId) clearInterval(g.timerId);
  updateCountdown();
  g.timerId = setInterval(updateCountdown, 1000);
}

function updateCountdown() {
  const left = g.session.expiresAt - now();
  const el = $('countdown');
  el.innerHTML = `<i class="fa-solid fa-hourglass-half"></i> ${fmtTime(left)}`;
  if (left < 60000) el.classList.add('urgent');
  else el.classList.remove('urgent');
  if (left <= 0) { clearInterval(g.timerId); newMailbox(); }
}

function toggleBusy(isBusy) {
  $('btn-new').disabled = isBusy; $('btn-refresh').disabled = isBusy;
  if (isBusy) $('refresh-icon').classList.add('spin');
  else $('refresh-icon').classList.remove('spin');
}

// --- Main Actions ---
async function newMailbox() {
  toggleBusy(true);
  try {
    g.session = await createAccount();
    mountSessionUI();
    resetViewer();
    showToast("Đã khởi tạo không gian làm việc mới!");
    
    // Tạo giả lập Email đầu tiên (Mô phỏng tự gửi mail HTML)
    const welcomeMail = {
      id: 'mock_welcome', 
      createdAt: new Date().toISOString(),
      from: { address: 'no-reply@premium.local', name: 'Đội ngũ Premium' },
      subject: '🎉 Chào mừng! Tài khoản của bạn đã sẵn sàng',
      intro: 'Tài khoản email tạm thời của bạn đã được khởi tạo thành công...',
      html: [generateWelcomeEmail(g.session.address)],
      isUnread: true
    };
    g.messages = [welcomeMail];
    renderInbox();
  } catch (e) {
    showToast("Lỗi máy chủ, vui lòng thử lại sau.", "error");
  } finally {
    toggleBusy(false);
  }
}

async function fetchMessages() {
  if (!g.session) return;
  toggleBusy(true);
  showSkeleton();
  try {
    const data = await apiReq('/messages?limit=30', { headers: { Authorization: 'Bearer ' + g.session.token } });
    let list = (data['hydra:member'] || []).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    
    // Nếu có mail thật, ta có thể ghi đè hoặc nối thêm mock email. 
    // Ở đây ta thêm Mock Email vào cuối danh sách nếu account mới tạo.
    const hasMock = g.messages.find(m => m.id === 'mock_welcome');
    g.messages = list;
    if (hasMock && !list.find(m => m.id === 'mock_welcome')) {
      g.messages.push(hasMock);
    }
    
    renderInbox();
    showToast("Đã cập nhật đồng bộ hộp thư");
  } catch (e) {
    renderInbox(); // Khôi phục UI
  } finally {
    toggleBusy(false);
  }
}

function renderInbox() {
  const box = $('inbox');
  $('mail-count').innerText = g.messages.length;
  if (g.messages.length === 0) {
    box.innerHTML = '<div style="text-align:center; padding: 20px; color: var(--muted); font-size: 14px;">Chưa có thư mới nào...</div>';
    return;
  }
  
  box.innerHTML = '';
  g.messages.forEach((m, index) => {
    const el = document.createElement('div');
    el.className = `mail-item ${m.isUnread ? 'unread' : ''}`;
    el.style.animationDelay = `${index * 0.05}s`;
    
    const time = new Date(m.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    const sender = (m.from && m.from.name) ? m.from.name : (m.from && m.from.address ? m.from.address : 'Ẩn danh');
    
    el.innerHTML = `
      <div class="mail-sender">${escapeHtml(sender)}</div>
      <div class="mail-subj">${escapeHtml(m.subject || '(Không tiêu đề)')}</div>
      <div class="mail-time"><i class="fa-regular fa-clock"></i> ${time}</div>
    `;
    
    el.addEventListener('click', () => {
      document.querySelectorAll('.mail-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      el.classList.remove('unread');
      m.isUnread = false; // Xóa chấm đỏ
      openMessage(m);
    });
    box.appendChild(el);
  });
}

async function openMessage(mCached) {
  $('v-empty').style.opacity = '0';
  setTimeout(() => $('v-empty').style.display = 'none', 300);
  
  const iframe = $('viewer-iframe');
  iframe.style.display = 'block';
  iframe.classList.remove('loaded');
  
  $('v-header').style.opacity = '1';
  $('v-subject').textContent = mCached.subject || '(Không có tiêu đề)';
  
  const senderName = mCached.from && mCached.from.name ? mCached.from.name : 'Ẩn danh';
  const senderAddr = mCached.from && mCached.from.address ? `<${mCached.from.address}>` : '';
  $('v-sender').textContent = `${senderName} ${senderAddr}`;
  $('v-date').textContent = new Date(mCached.createdAt).toLocaleString();
  
  // Set avatar character
  document.querySelector('.avatar').textContent = senderName.charAt(0).toUpperCase();

  try {
    let content = '';
    // Nếu là Mock Mail thì lấy luôn HTML đã tạo
    if (mCached.id === 'mock_welcome') {
      content = mCached.html[0];
    } else {
      // Thư thật từ API
      const m = await apiReq('/messages/' + mCached.id, { headers: { Authorization: 'Bearer ' + g.session.token } });
      if (m.html && m.html.length > 0) content = m.html[0];
      else if (m.text) content = `<pre style="font-family:'Plus Jakarta Sans',sans-serif; padding:30px; color:#334155; white-space:pre-wrap;">${escapeHtml(m.text)}</pre>`;
      else content = `<div style="padding:30px; color:#94a3b8;">(Email trống)</div>`;
    }
    
    iframe.srcdoc = content;
    iframe.onload = () => iframe.classList.add('loaded');
  } catch (e) {
    iframe.srcdoc = `<div style="padding:30px; color:red;">Lỗi tải nội dung: ${e.message}</div>`;
    iframe.classList.add('loaded');
  }
}

function resetViewer() {
  $('v-header').style.opacity = '0.5';
  $('v-subject').textContent = 'Chưa có thư nào được chọn';
  $('v-sender').textContent = 'Hệ thống';
  $('v-date').textContent = 'Chọn một thư bên trái để bắt đầu đọc';
  $('v-empty').style.display = 'flex';
  $('v-empty').style.opacity = '1';
  $('viewer-iframe').style.display = 'none';
  $('viewer-iframe').srcdoc = '';
  document.querySelector('.avatar').innerHTML = '<i class="fa-solid fa-user-astronaut"></i>';
}

// --- Copy & UI Interactions ---
async function copyText(id, name) {
  try {
    await navigator.clipboard.writeText($(id).value);
    showToast(`Đã lưu ${name} vào bộ nhớ tạm!`);
  } catch { showToast("Lỗi Copy", "error"); }
}

function togglePass() {
  const input = $('password'), btn = $('btn-toggle-pass');
  if (input.type === 'password') { input.type = 'text'; btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>'; }
  else { input.type = 'password'; btn.innerHTML = '<i class="fa-regular fa-eye"></i>'; }
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && g.session) updateCountdown(); });

// Khởi chạy hệ thống
(async function init() {
  toggleBusy(true);
  try { 
    g.session = await ensureSession(); 
    mountSessionUI(); 
    
    // Nếu chưa có mail nào trong JS memory, fetch lại từ API
    if (g.messages.length === 0) await fetchMessages();
    
    // Check lại nếu thật sự ko có mail nào, đẩy Mock Mail vào
    if (g.messages.length === 0) {
      g.messages = [{
        id: 'mock_welcome', createdAt: new Date().toISOString(),
        from: { address: 'no-reply@premium.local', name: 'Đội ngũ Premium' },
        subject: '🎉 Chào mừng! Tài khoản của bạn đã sẵn sàng',
        html: [generateWelcomeEmail(g.session.address)], isUnread: true
      }];
      renderInbox();
    }
  } catch (e) { 
    showToast("Lỗi kết nối máy chủ", "error");
  } finally { toggleBusy(false); }
})();
</script>
